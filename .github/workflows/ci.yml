name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.0'
          python-version: '3.12'
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest && uv run ruff check . && uv run ruff format --check .
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        env:
          VITE_API_BASE_URL: https://bayt-api.example.com
        working-directory: frontend
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bayt-api:ci backend
      - run: bash scripts/check-container.sh bayt-api:ci
