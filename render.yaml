# Reference configuration for the service created through Render MCP.
# Do not apply a second Blueprint to manage the existing service.
services:
  - type: web
    name: arabic-poetry-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_THINKING_LEVEL
        value: medium
      # Public generation authorized; app serializes generation and cools exhausted keys.
      - key: GENERATION_ENABLED
        value: 'true'
      - key: CORS_ORIGINS
        sync: false
# Set GEMINI_API_KEY, GEMINI_API_KEY_2 and GEMINI_API_KEY_3 privately in Render.
# Optional GEMINI_KEY_PROJECTS maps slot numbers to shared project IDs.
# Groq is optional; never add provider credentials to frontend variables.
