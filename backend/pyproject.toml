[project]
name = "bayt-backend"
version = "0.1.0"
description = "Arabic poetry generation with deterministic PyArud feedback"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "pydantic-settings>=2.6",
    "pydantic==2.13.5",
    "httpx>=0.28",
    "pyarud==1.0.0",
    "onnxruntime>=1.22,<2",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
